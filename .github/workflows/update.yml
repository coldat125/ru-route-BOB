name: update

on:
  schedule:
    - cron: "30 2 * * *"   # каждый день, 02:30 UTC (05:30 МСК)
  workflow_dispatch:
  push:
    paths: ["build.py", ".github/workflows/update.yml"]

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download upstream
        run: |
          mkdir -p src
          base=https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download
          curl -fsSL --retry 3 -o src/geoip.dat   $base/geoip.dat
          curl -fsSL --retry 3 -o src/geosite.dat $base/geosite.dat

      - run: python3 build.py --selftest

      - run: python3 build.py

      - name: Changed?
        id: check
        run: |
          git add -f dist/manifest.txt dist/sha256sum.txt
          if git diff --cached --quiet; then
            echo "changed=0" >> $GITHUB_OUTPUT
            echo "апстрим не менялся, релиз не публикуем"
          else
            echo "changed=1" >> $GITHUB_OUTPUT
          fi

      # по расписанию — только если апстрим реально поменялся; на push и ручной запуск
      # публикуем всегда, иначе правки build.py не доехали бы до релиза
      - name: Release
        if: steps.check.outputs.changed == '1' || github.event_name != 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(date -u +%Y%m%d)
          gh release create "$tag" dist/* --title "$tag" --notes-file dist/manifest.txt --latest \
            || gh release upload "$tag" dist/* --clobber

      - name: Commit
        if: steps.check.outputs.changed == '1'
        run: |
          git config user.name  github-actions
          git config user.email github-actions@github.com
          git commit -m "update $(date -u +%F)"
          git push
